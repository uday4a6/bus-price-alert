# Checks AbhiBus prices every 5 minutes and pushes drops to your phone via ntfy.
#
# Settings (repo Settings -> Secrets and variables -> Actions):
#   secret   NTFY_TOPIC   ntfy topic your phone is subscribed to (required)
#   variable TRAVEL_DATE  DD-MM-YYYY, or leave unset to watch today's buses (IST)
#   variable MIN_DROP     alert when a bus drops at least this much (default 300)
#   variable ALERT_BELOW  alert when cheapest bus is at or below this (default 1299)
#   variable MIN_LEAD     ignore buses leaving within N minutes (default 45)
#   variable DEPART_AFTER / DEPART_BEFORE  only buses leaving in this window, HH:MM 24h (e.g. 17:00 / 22:00)
#   variable BUS_TYPE     words that must appear in the bus type (e.g. "9600 multiaxle")
#
# Once TRAVEL_DATE has passed, the workflow disables itself.

name: Bus price alert

on:
  # GitHub's cron is unreliable for short intervals, so each run loops for 55 min
  # (a check every 5 min) and then dispatches the next run itself. This hourly
  # cron is only a backup that restarts the chain if it breaks.
  schedule:
    - cron: "7 0-18 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert with current cheapest buses"
        type: boolean
        default: false

concurrency:
  group: bus-price-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write   # to dispatch the next run
      contents: read
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Stop if trip is over
        id: trip
        env:
          TRAVEL_DATE: ${{ vars.TRAVEL_DATE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TRAVEL_DATE" ]; then
            trip=$(echo "$TRAVEL_DATE" | awk -F- '{print $3$2$1}')
            if [ "$trip" -lt "$(date +%Y%m%d)" ]; then
              echo "Travel date $TRAVEL_DATE has passed, disabling workflow"
              gh workflow disable bus-price-alert.yml --repo "$GITHUB_REPOSITORY"
              echo "over=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v4
        if: steps.trip.outputs.over != '1'

      # previous run's lowest prices, so we can tell what dropped
      - uses: actions/cache/restore@v4
        if: steps.trip.outputs.over != '1'
        with:
          path: .bus_alert_state
          key: bus-state-${{ github.run_id }}
          restore-keys: bus-state-

      - name: Check prices
        if: steps.trip.outputs.over != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TRAVEL_DATE: ${{ vars.TRAVEL_DATE }}
          MIN_DROP: ${{ vars.MIN_DROP }}
          ALERT_BELOW: ${{ vars.ALERT_BELOW }}
          MIN_LEAD: ${{ vars.MIN_LEAD }}
          DEPART_AFTER: ${{ vars.DEPART_AFTER }}
          DEPART_BEFORE: ${{ vars.DEPART_BEFORE }}
          BUS_TYPE: ${{ vars.BUS_TYPE }}
          # test run: single check with test alert; normal run: loop 55 min
          MODE: ${{ inputs.test && '--test-alert' || '--every 5 --for 55' }}
        run: |
          python3 -u bus_price_alert.py $MODE \
            --date "${TRAVEL_DATE:-today}" \
            --min-drop "${MIN_DROP:-300}" \
            --alert-below "${ALERT_BELOW:-1299}" \
            --min-lead "${MIN_LEAD:-45}" \
            --depart-after "${DEPART_AFTER:-}" \
            --depart-before "${DEPART_BEFORE:-}" \
            --bus-type "${BUS_TYPE:-}" \
            --ntfy "$NTFY_TOPIC"

      - uses: actions/cache/save@v4
        if: always() && steps.trip.outputs.over != '1'
        with:
          path: .bus_alert_state
          key: bus-state-${{ github.run_id }}

      # chain: start the next run, except at night (00:30-05:30 IST); the cron restarts it in the morning
      - name: Dispatch next run
        if: success() && !inputs.test && steps.trip.outputs.over != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$((10#$(date +%H%M)))
          if [ "$now" -ge 30 ] && [ "$now" -lt 530 ]; then
            echo "Night time, not chaining"
          else
            gh workflow run bus-price-alert.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          fi
